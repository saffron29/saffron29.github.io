principales:
  - titulo: "Mapeé dónde se decidió la elección presidencial de 2021"
    enlace: "/portfolio/elecciones-2021/"
    imagen: "/images/elecciones-2021-dashboard.png"
    alt: "Vista nacional del dashboard del voto territorial 2021"
    etiqueta: "Python · ONPE e INEI · Dashboard"
    pregunta: "¿Cómo se distribuyó territorialmente el voto de 2021 y qué cambió entre la primera y la segunda vuelta?"
    descripcion: "Se limpiaron las 86,488 mesas de la ONPE de cada vuelta, se agregaron en 1,874 distritos y se cruzaron con la pobreza distrital del INEI."
    cifra: "16 de 25"
    cifra_texto: "departamentos votaron por Castillo en la segunda vuelta. En el 20% más pobre de los distritos obtuvo el 78.0% de los votos válidos, frente al 42.5% en el 20% menos pobre."
    botones:
      - texto: "Dashboard"
        url: "https://saffron29.github.io/tarea_3/"
      - texto: "Reel"
        url: "/videos/"
      - texto: "Código"
        url: "https://github.com/saffron29/tarea_3"
      - texto: "Detalle"
        url: "/portfolio/elecciones-2021/"
    herramientas: "Python · pandas · geopandas · Plotly.js · Qwen3-TTS · GitHub Pages"

  - titulo: "Tres skills que limpian, grafican y mapean la ENAHO 2024"
    enlace: "/portfolio/enaho-skills/"
    imagen: "/images/enaho-mapa-pobreza-2024.png"
    alt: "Mapa de pobreza monetaria por departamento, 2024"
    etiqueta: "Claude Code · Skills · ENAHO 2024"
    pregunta: "¿Puede un agente limpiar la ENAHO y replicar la pobreza oficial?"
    descripcion: "Tres skills con scripts en Python y reglas fijas: las llaves se leen como texto, se pondera con el factor de expansión y los departamentos se unen al mapa por código, nunca por nombre."
    cifra: "27.58%"
    cifra_texto: "de pobreza monetaria en 2024, igual que la cifra oficial del INEI, con 108,664 residentes habituales."
    botones:
      - texto: "Código"
        url: "https://github.com/saffron29/enaho-skills"
      - texto: "Evaluación"
        url: "https://github.com/saffron29/enaho-skills/blob/main/evaluacion.md"
      - texto: "Mapa"
        url: "/images/enaho-mapa-pobreza-2024.png"
      - texto: "Detalle"
        url: "/portfolio/enaho-skills/"
    herramientas: "Python · pandas · geopandas · matplotlib · pyarrow · Claude Code"

  - titulo: "Transcribí 90 minutos de clase en menos de 2 con Whisper"
    enlace: "/portfolio/transcribir-audio/"
    imagen: "/images/whisper-tiempos.png"
    alt: "91.6 minutos de audio, transcritos en 1.6 minutos"
    etiqueta: "Python · Google Colab · Whisper"
    pregunta: "¿Se puede transcribir una grabación larga gratis, rápido y sin que Whisper invente texto en los silencios?"
    descripcion: "Un cuaderno que transcribe por lotes en la GPU y que, con un detector de voz, solo le entrega al modelo los tramos en los que alguien habla."
    cifra: "1.6 min"
    cifra_texto: "para transcribir 91.6 minutos de audio en la GPU gratuita de Colab, unas 57 veces más rápido que escucharlo; el detector de voz saltó 49.3 minutos sin voz."
    botones:
      - texto: "Abrir en Colab"
        url: "https://colab.research.google.com/github/saffron29/transcribir-audio/blob/main/WhisperTranscribe_v2.ipynb"
      - texto: "Código"
        url: "https://github.com/saffron29/transcribir-audio"
      - texto: "Detalle"
        url: "/portfolio/transcribir-audio/"
    herramientas: "faster-whisper · Silero VAD · pyannote · pandas · Google Colab"

  - titulo: "Construí un servidor MCP con las series oficiales del BCRP"
    enlace: "/portfolio/mcp-bcrp/"
    imagen: "/images/mcp-bcrp-aciertos.png"
    alt: "Aciertos del modelo con y sin el MCP del BCRP"
    etiqueta: "MCP · FastMCP · API del BCRP"
    pregunta: "¿Acierta más un modelo de IA las cifras económicas con datos oficiales que con su memoria?"
    descripcion: "Un servidor que busca entre las 17,167 series del BCRP, las descarga, calcula variaciones y mide la correlación entre dos series."
    cifra: "10 de 10"
    cifra_texto: "cifras oficiales correctas con el servidor, frente a 0 de 10 cuando el modelo respondió de memoria."
    botones:
      - texto: "Informe"
        url: "https://github.com/saffron29/mcp-bcrp/blob/main/informe.md"
      - texto: "Código"
        url: "https://github.com/saffron29/mcp-bcrp"
      - texto: "Detalle"
        url: "/portfolio/mcp-bcrp/"
    herramientas: "Python · FastMCP · pytest · matplotlib · Claude Code"

mas_trabajos:
  - titulo: "Voces y documentos peruanos: del archivo escaneado al texto buscable"
    etiqueta: "OCR · Voz a texto · Streamlit"
    texto: "PaddleOCR y faster-whisper convierten prensa escaneada y noticieros en texto buscable, con un error por carácter de 0.01 en fotos de prensa y un WER de 0.04 en noticieros, en una laptop sin GPU."
    enlaces:
      - texto: "Demo"
        url: "https://voces-documentos-peru.streamlit.app/"
      - texto: "Código"
        url: "https://github.com/saffron29/tarea_2"
  - titulo: "Clasificador de titulares de noticias peruanas"
    etiqueta: "Transformers · Hugging Face"
    texto: "Un BETO ajustado con etiquetas generadas por un LLM local clasifica titulares de La República en 4 categorías con F1 macro = 0.88, por encima del propio LLM que lo entrenó (0.79)."
    enlaces:
      - texto: "Código"
        url: "https://github.com/saffron29/tarea_1"
  - titulo: "¿Es 2026 un año récord de incendios en el Perú?"
    etiqueta: "Satélites · VIIRS · Sentinel-2"
    texto: "Con 50,996 focos de calor hasta el 20 de octubre, 2026 no es un año récord a nivel nacional (puesto 12 de 15), pero sí lo es en Arequipa y Lima."
    enlaces:
      - texto: "Código"
        url: "https://github.com/saffron29/incendios-record"
  - titulo: "Un informe convertido en reel, con voz propia"
    etiqueta: "Voz con IA · Modelos abiertos"
    texto: "El informe sobre los incendios de 2026, convertido en un reel vertical de 49.2 segundos narrado con una voz clonada a partir de la del autor."
    enlaces:
      - texto: "Código"
        url: "https://github.com/saffron29/reel-incendios"
  - titulo: "Percepción de la corrupción en el mundo, 2017–2022"
    etiqueta: "R · Quarto · Shiny"
    texto: "Dashboard interactivo con el Índice de Percepción de la Corrupción, que compara al Perú con su región y con el resto del mundo."
    enlaces:
      - texto: "Dashboard"
        url: "https://01a17b4f-36a9-b2ba-ac33-5f4dd22e898f.share.connect.posit.cloud/"

tesis:
  titulo: "«Piensa en tu futuro. No al comunismo»: Amenaza existencial como principal factor detrás de la evolución del discurso de exponentes de la derecha peruana durante las Elecciones Generales de 2021"
  detalle: "Tesis de licenciatura en Ciencia Política y Gobierno · PUCP, 2025 · Asesor: Martín Tanaka"
  resumen: "Analiza la evolución del discurso de la derecha peruana desde el inicio de la campaña de 2021 hasta la proclamación de Pedro Castillo, y sostiene que la percepción de una amenaza existencial en su candidatura fue el principal factor detrás de la radicalización del discurso de muchos de sus exponentes."
  repositorio: "https://tesis.pucp.edu.pe/items/92cd06e8-c29f-4b5b-894d-2083c4518d7b"
  pdf: "/files/tesis-pinares-gutierrez-2025.pdf"

