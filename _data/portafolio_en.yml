principales:
  - titulo: "I mapped where Peru's 2021 presidential election was decided"
    enlace: "/en/projects/elections-2021/"
    imagen: "/images/elecciones-2021-dashboard.png"
    alt: "National view of the 2021 territorial vote dashboard"
    etiqueta: "Python · ONPE & INEI · Dashboard"
    pregunta: "How was the 2021 presidential vote distributed across the country, and what changed between the first round and the runoff?"
    descripcion: "The 86,488 polling-station results published by ONPE (National Office of Electoral Processes) for each round were cleaned, aggregated into 1,874 districts and merged with district-level poverty estimates from INEI (National Institute of Statistics)."
    cifra: "16 of 25"
    cifra_texto: "departments voted for Castillo in the runoff. In the poorest 20% of districts he won 78.0% of the valid votes, compared with 42.5% in the least poor 20%."
    botones:
      - texto: "Dashboard"
        url: "https://saffron29.github.io/tarea_3/"
      - texto: "Reel"
        url: "/en/videos/"
      - texto: "Code"
        url: "https://github.com/saffron29/tarea_3"
      - texto: "Details"
        url: "/en/projects/elections-2021/"
    herramientas: "Python · pandas · geopandas · Plotly.js · Qwen3-TTS · GitHub Pages"

  - titulo: "Three skills that clean, chart and map Peru's 2024 household survey"
    enlace: "/en/projects/enaho-skills/"
    imagen: "/images/enaho-mapa-pobreza-2024.png"
    alt: "Map of monetary poverty by department, 2024"
    etiqueta: "Claude Code · Skills · ENAHO 2024"
    pregunta: "Can an AI agent clean the ENAHO (National Household Survey) and replicate the official poverty rate?"
    descripcion: "Three skills with Python scripts and fixed rules: survey keys are read as text, estimates are weighted with the expansion factor, and departments are joined to the map by code, never by name."
    cifra: "27.58%"
    cifra_texto: "monetary poverty in 2024, matching INEI's official figure, computed over 108,664 usual residents."
    botones:
      - texto: "Code"
        url: "https://github.com/saffron29/enaho-skills"
      - texto: "Evaluation"
        url: "https://github.com/saffron29/enaho-skills/blob/main/evaluacion.md"
      - texto: "Map"
        url: "/images/enaho-mapa-pobreza-2024.png"
      - texto: "Details"
        url: "/en/projects/enaho-skills/"
    herramientas: "Python · pandas · geopandas · matplotlib · pyarrow · Claude Code"

  - titulo: "I transcribed 90 minutes of class in under 2 with Whisper"
    enlace: "/en/projects/audio-transcription/"
    imagen: "/images/whisper-tiempos.png"
    alt: "91.6 minutes of audio, transcribed in 1.6 minutes"
    etiqueta: "Python · Google Colab · Whisper"
    pregunta: "Can a long recording be transcribed for free, quickly, and without Whisper inventing text during silences?"
    descripcion: "A notebook that transcribes in batches on the GPU and, through a voice activity detector, only feeds the model the segments in which someone is speaking."
    cifra: "1.6 min"
    cifra_texto: "to transcribe 91.6 minutes of audio on Colab's free GPU, about 57 times faster than listening to it; the voice detector skipped 49.3 minutes of silence."
    botones:
      - texto: "Open in Colab"
        url: "https://colab.research.google.com/github/saffron29/transcribir-audio/blob/main/WhisperTranscribe_v2.ipynb"
      - texto: "Code"
        url: "https://github.com/saffron29/transcribir-audio"
      - texto: "Details"
        url: "/en/projects/audio-transcription/"
    herramientas: "faster-whisper · Silero VAD · pyannote · pandas · Google Colab"

  - titulo: "I built an MCP server with the official series of Peru's Central Bank"
    enlace: "/en/projects/bcrp-mcp/"
    imagen: "/images/mcp-bcrp-aciertos.png"
    alt: "Model accuracy with and without the BCRP MCP server"
    etiqueta: "MCP · FastMCP · BCRP API"
    pregunta: "Does an AI model get economic figures right more often with official data than from memory?"
    descripcion: "A server that searches the 17,167 series of the Central Reserve Bank of Peru (BCRP), downloads them, computes changes and measures the correlation between two series."
    cifra: "10 of 10"
    cifra_texto: "official figures correct with the server, compared with 0 of 10 when the model answered from memory."
    botones:
      - texto: "Report"
        url: "https://github.com/saffron29/mcp-bcrp/blob/main/informe.md"
      - texto: "Code"
        url: "https://github.com/saffron29/mcp-bcrp"
      - texto: "Details"
        url: "/en/projects/bcrp-mcp/"
    herramientas: "Python · FastMCP · pytest · matplotlib · Claude Code"

mas_trabajos:
  - titulo: "Peruvian voices and documents: from scanned archives to searchable text"
    etiqueta: "OCR · Speech to text · Streamlit"
    texto: "PaddleOCR and faster-whisper turn scanned newspapers and newscasts into searchable text, with a character error rate of 0.01 on newspaper photos and a WER of 0.04 on newscasts, on a laptop without a GPU."
    enlaces:
      - texto: "Demo"
        url: "https://voces-documentos-peru.streamlit.app/"
      - texto: "Code"
        url: "https://github.com/saffron29/tarea_2"
  - titulo: "A classifier for Peruvian news headlines"
    etiqueta: "Transformers · Hugging Face"
    texto: "A BETO model fine-tuned on labels generated by a local LLM classifies La República headlines into 4 categories with a macro F1 of 0.88, outperforming the very LLM that trained it (0.79)."
    enlaces:
      - texto: "Code"
        url: "https://github.com/saffron29/tarea_1"
  - titulo: "Is 2026 a record year for wildfires in Peru?"
    etiqueta: "Satellites · VIIRS · Sentinel-2"
    texto: "With 50,996 fire hotspots up to October 20, 2026 is not a record year nationwide (12th of 15), but it is in Arequipa and Lima."
    enlaces:
      - texto: "Code"
        url: "https://github.com/saffron29/incendios-record"
  - titulo: "A report turned into a reel, in a cloned voice"
    etiqueta: "AI voice · Open models"
    texto: "The report on the 2026 wildfires, turned into a 49.2-second vertical reel narrated with a voice cloned from the author's own."
    enlaces:
      - texto: "Code"
        url: "https://github.com/saffron29/reel-incendios"
  - titulo: "Perceptions of corruption worldwide, 2017–2022"
    etiqueta: "R · Quarto · Shiny"
    texto: "An interactive dashboard on the Corruption Perceptions Index that compares Peru with its region and with the rest of the world."
    enlaces:
      - texto: "Dashboard"
        url: "https://01a17b4f-36a9-b2ba-ac33-5f4dd22e898f.share.connect.posit.cloud/"

tesis:
  titulo: "«Piensa en tu futuro. No al comunismo»: Amenaza existencial como principal factor detrás de la evolución del discurso de exponentes de la derecha peruana durante las Elecciones Generales de 2021"
  titulo_traducido: "[“Think about your future. No to communism”: Existential threat as the main factor behind the evolution of the discourse of Peruvian right-wing figures during the 2021 General Elections]"
  detalle: "Licentiature thesis in Political Science and Government · PUCP, 2025 · Advisor: Martín Tanaka · In Spanish"
  resumen: "It analyzes how the discourse of the Peruvian right evolved from the start of the 2021 campaign to the proclamation of Pedro Castillo, and argues that the perception of an existential threat in his candidacy was the main factor behind the radicalization of the discourse of many of its figures."
  repositorio: "https://tesis.pucp.edu.pe/items/92cd06e8-c29f-4b5b-894d-2083c4518d7b"
  pdf: "/files/tesis-pinares-gutierrez-2025.pdf"

